[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gel-ped"
version = "1.0.0"
description = "GEL-Ped: an instability-triggered safeguard for short-horizon pedestrian prediction"
authors = [{ name = "Amir Ghorbani" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "scikit-learn>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]
graph = ["torch>=2.2"]

[project.urls]
Repository = "https://github.com/AmirNetwork/GEL-Ped"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
